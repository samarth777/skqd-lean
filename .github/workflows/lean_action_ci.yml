name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
      - name: Audit SKQD theorem dependencies and edge cases
        run: lake env lean LeanExperiments/SKQD/Audit.lean
